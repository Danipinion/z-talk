version: '3.8'

services:
  z-talk-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: z-talk-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
    volumes:
      # Mount the firebase credentials key securely as read-only
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
